<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fourier, Wavelets & Uncertainty Web Lab</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #020617;
    color: #e5e7eb;
}
header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #1e293b;
}
.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 20px;
}
.panel {
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 15px;
}
canvas {
    background: #020617;
    display: block;
    margin: 10px auto;
}
input[type=range] {
    width: 100%;
}
pre {
    background: #020617;
    border: 1px solid #1e293b;
    padding: 10px;
    border-radius: 8px;
}
footer {
    text-align: center;
    padding: 12px;
    font-size: 14px;
    opacity: 0.7;
}
</style>
</head>

<body>

<header>
<h1>Fourier, Wavelets & Uncertainty Web Lab</h1>
<p>Time–Frequency Duality and the Heisenberg Principle</p>
</header>

<div class="container">

<div class="panel">
<h2>Time Domain</h2>
<canvas id="timeCanvas" width="400" height="200"></canvas>
σ:
<input type="range" id="sigma" min="0.05" max="0.5" step="0.01" value="0.15">
<pre id="timeInfo"></pre>
</div>

<div class="panel">
<h2>Fourier Spectrum</h2>
<canvas id="freqCanvas" width="400" height="200"></canvas>
<pre id="freqInfo"></pre>
</div>

<div class="panel">
<h2>Windowed Fourier (Gabor)</h2>
<canvas id="windowCanvas" width="400" height="200"></canvas>
t₀:
<input type="range" id="t0" min="-1" max="1" step="0.01" value="0">
</div>

<div class="panel">
<h2>Haar Wavelet</h2>
<canvas id="waveletCanvas" width="400" height="200"></canvas>
<pre id="uncertaintyInfo"></pre>
</div>

</div>

<footer>
Mathematical Physics · Fourier Analysis · Wavelets
</footer>

<script>
const N = 256;
const t = Array.from({length: N}, (_, i) => -1 + 2*i/(N-1));

const timeCtx = timeCanvas.getContext("2d");
const freqCtx = freqCanvas.getContext("2d");
const windowCtx = windowCanvas.getContext("2d");
const waveletCtx = waveletCanvas.getContext("2d");

function gaussian(x, s) {
    return Math.exp(-x*x/(2*s*s));
}

function dft(signal) {
    const mag = [];
    for (let k = 0; k < N; k++) {
        let re = 0, im = 0;
        for (let n = 0; n < N; n++) {
            const a = 2*Math.PI*k*n/N;
            re += signal[n]*Math.cos(a);
            im -= signal[n]*Math.sin(a);
        }
        mag.push(Math.sqrt(re*re + im*im));
    }
    return mag;
}

function normalize(arr) {
    const m = Math.max(...arr.map(v => Math.abs(v))) || 1;
    return arr.map(v => v/m);
}

function draw(ctx, signal, color) {
    ctx.clearRect(0,0,400,200);
    ctx.strokeStyle = color;
    ctx.beginPath();
    signal.forEach((y,i)=>{
        const x = i*400/N;
        const py = 100 - 80*y;
        i===0 ? ctx.moveTo(x,py) : ctx.lineTo(x,py);
    });
    ctx.stroke();
}

function update() {
    const σ = +sigma.value;
    const t0 = +t0Slider.value;

    const ψ = t.map(x => gaussian(x,σ));
    draw(timeCtx, normalize(ψ), "#38bdf8");

    const Ψ = normalize(dft(ψ));
    draw(freqCtx, Ψ, "#f87171");

    const windowed = t.map((x,i)=>
        ψ[i] * Math.exp(-((x - t0) ** 2) / 0.02)
    );
    draw(windowCtx, normalize(windowed), "#4ade80");

    const haar = t.map(x => x<0 ? 1 : -1);
    draw(waveletCtx, haar, "#a78bfa");

    const Δt = σ;
    const Δω = 1/(2*Math.PI*σ);

    timeInfo.textContent = `Δt ≈ ${Δt.toFixed(3)}`;
    freqInfo.textContent = `Δω ≈ ${Δω.toFixed(3)}`;
    uncertaintyInfo.textContent =
`Δt·Δω ≈ ${(Δt*Δω).toFixed(3)}
Gaussian saturates uncertainty bound`;
}

const sigma = document.getElementById("sigma");
const t0Slider = document.getElementById("t0");

sigma.addEventListener("input", update);
t0Slider.addEventListener("input", update);
update();
</script>

</body>
</html>
